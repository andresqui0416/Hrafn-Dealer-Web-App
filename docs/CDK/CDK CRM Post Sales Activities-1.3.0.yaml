definitions:
  CreateCompletedActivityRequest:
    type: object
    properties:
      opportunityId:
        description: Unique identifier for the opportunity
        format: uuid
        type: string
      completedDate:
        description: The date/time in UTC the task was completed
        format: date-time
        type: string
      activityName:
        description: Name of the activity
        type: string
      activityType:
        description: Type of activity, as retrieved from the GetActivityTypes method
        format: int32
        type: integer
      comments:
        description: Activity comments
        type: string
      message:
        type: object
        properties:
          from:
            description: Email address that this message is from
            type: string
          recipients:
            description: A collection of recipient email addresses
            type: array
            items:
              type: string
          carbonCopies:
            description: A collection of .cc email addresses
            type: array
            items:
              type: string
          subject:
            description: Email subject
            type: string
          body:
            description: Email body
            type: string
          isHtml:
            description: Is the body in HTML format?
            type: boolean
        required:
          - from
          - recipients
          - subject
          - body
          - isHtml
        example:
          from: ac.slater@email.com
          recipients:
            - zack.morris@email.com
            - samuel.powers@email.com
          carbonCopies:
            - richard.belding@bayside.edu
          subject: Email Subject
          body: <h1>Headline</h1><p>This is the email body.</p>
          isHtml: true
      completedByEmployeeId:
        description: Unique identifer for the employee that completed the activity
        format: uuid
        type: string
    required:
      - opportunityId
      - completedDate
      - activityName
      - activityType
    example:
      opportunityId: 77c53c2a-77bd-4f21-a83e-c571b94bb21f
      completedDate: 2020-03-13T10:39:51.402Z
      activityName: Activity Name 1
      activityType: 1
      comments: Comments go here
      message:
        - from: ac.slater@email.com
          recipients:
