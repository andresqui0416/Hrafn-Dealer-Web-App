swagger: "2.0"
info:
  version: 1.3.0
  title: Elead Sales Activities
  description: >
    # Elead - Sales - Activities

    # What does this API do?

    This API allows for the creation of scheduled and completed activities. Email message details are provided to and logged for the dealer or vendor partner. 

    ## Capabilities and Features

    This API includes the following capabilities and features for managing activities for existing opportunities.

    - Create new scheduled activities 
        
    - Create new completed activities
        
    - Create a new email message for a scheduled activity and complete the scheduled activity

    - Create follow up activity with expected outcome

    - Retrieve activity history by customer, opportunity, or user

    - Retrieve available outcomes by activity id

    - Retrieve activity by activity id

    - Add inbound/outbound call data to a scheduled activity and complete the scheduled activity

    # Intended Audience

    This API is for dealer and vendor partners who schedule and complete opportunity activities.
