    get:
      summary: Get activity history by user id
      description: Gets activity history by user id
      tags:
        - Activities
      operationId: Activities_GetActivityHistoryByUserId
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: Accept
          in: header
          required: false
          type: string
        - name: Accept-Charset
          in: header
          required: false
          type: string
        - name: Prefer
          in: header
          required: false
          type: string
          format: enum
          enum:
            - return=minimal
            - return=representation
        - name: Request-Id
          in: header
          required: true
          type: string
        - name: userId
          in: path
          required: true
          type: string
          format: uuid
        - name: fromDate
          description: This is limited to a max of a 31 day range. Filters on the
            completed date of the activity, or the due date if the activity is
            open.
          in: query
          required: false
          type: string
          format: date-time
        - name: toDate
          description: This is limited to a max of a 31 day range. Filters on the
            completed date of the activity, or the due date if the activity is
            open.
