    post:
      summary: Updates an activity using the specified activityId and request model
      description: >
        Updates an activity using the specified activityId and request
        model. The activityId specified must be a valid "Open" activity. If a
        valid next activity outcomeId is specified in the request model, then'

        - The current activity will be completed, and

        - A next task may be created as determined by the specified outcomeId
      tags:
        - Activities
      operationId: Activities_UpdateActivity
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: Accept
          in: header
          required: false
          type: string
        - name: Accept-Charset
          in: header
          required: false
          type: string
        - name: Prefer
          in: header
          required: false
          type: string
          format: enum
          enum:
            - return=minimal
            - return=representation
        - name: Request-Id
          in: header
          required: true
          type: string
        - name: activityId
          description: Elead activity unique identifier
          in: path
          required: true
          type: string
          format: uuid
        - name: request
          in: body
          required: true
          schema:
            type: object
            properties:
              currentActivity:
                type: object
                properties:
                  assignedToUserId:
                    description: Unique identifier for the person the activity is assigned to
                    format: uuid
                    type: string
                  comments:
                    description: Activity comments
                    type: string
