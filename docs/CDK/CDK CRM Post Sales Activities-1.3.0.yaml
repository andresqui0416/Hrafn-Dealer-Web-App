  /complete:
    post:
      summary: Create a new completed activity for an existing opportunity
      description: Creates a new completed activity with optional message
      tags:
        - Activities
      operationId: Activities_CompleteActivity
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: Accept
          in: header
          required: false
          type: string
        - name: Accept-Charset
          in: header
          required: false
          type: string
        - name: Prefer
          in: header
          required: false
