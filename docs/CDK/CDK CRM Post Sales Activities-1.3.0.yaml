                      type: string
                    assignedTo:
                      description: Name of the user that the activity is assigned to
                      type: string
                    completedBy:
                      description: Name of the user that the activity was completed by
                      type: string
                    opportunityId:
                      description: Unique identifier for the opportunity to which this activity
                        belongs
                      type: string
                      format: uuid
                    upType:
                      description: Up type for this activity's opportunity
                      enum:
                        - Unknown
                        - Campaign
                        - Internet
                        - Phone
                        - Showroom
                      type: string
                    source:
                      description: Source
                      type: string
                    subSource:
                      description: Sub-source
                      type: string
