swagger: "2.0"
info:
  version: 1.0.2
  title: Vehicles
  description: >
    # CDK Drive - Service - Vehicles

    Associates identification, type, status, and customer information about a vehicle.


    # What does this API do?

    The API will allow you to create, update, query, and retrieve service domain vehicle information in CDK Drive. 


    # Intended Audience

    Vehicle is a dependency for Service Appointment and Service Repair Order workflows. 
basePath: /cdkdrive/service/v1/vehicles
securityDefinitions:
  permission-model:
    type: oauth2
    flow: implicit
    authorizationUrl: https://identity.fortellis.io/oauth2/
schemes:
  - https
paths:
  /:
    get:
      summary: Query vehicles
      description: Query vehicles
      operationId: queryVehicles
      tags:
        - query
      parameters:
        - name: Request-Id
          in: header
          required: false
          type: string
          format: guid
          description: A correlation ID that should be returned back to the caller to
            indicate the return of the given request
        - name: vin
          in: query
          description: Filters vehicles by VIN
          type: string
        - name: licensePlateNum
          in: query
          description: Filters vehicles by license plate number
          type: string
        - name: customerId
          in: query
          description: Filters vehicles by customerId
          type: string
        - &a1
          name: Subscription-Id
          in: header
          description: The Fortellis Marketplace subscription identifier between a user
            entity and the app.
          required: true
          type: string
          default: test
        - &a2
          name: Authorization
          in: header
          description: Provides authorization to access Fortellis APIs. For calling a
            Fortellis Provider, this must be an OAuth 2.0 token issued by the
            Fortellis authorization server.
          required: true
          type: string
          disabled: true
          placeholder: Automatically set
      produces:
        - application/json
      consumes:
        - application/json
      responses:
        "200":
          description: OK
          headers:
            Request-Id:
              type: string
          schema:
            description: Vehicles collection
            type: object
            properties:
              items:
                type: array
                items:
                  description: Vehicle respose object
                  type: object
                  required:
                    - vehicleId
                    - identification
                    - specification
                    - status
                    - dates
                    - links
                  example:
                    vehicleId: 1234ABCD
                    identification:
                      vin: 5TFAW5F19EX759955
                      licensePlateNum: 1ABC123
                    specification:
                      makeCode: TOY
                      make: Toyota
                      modelCode: TUNDRA
                      model: Tundra
                      modelYear: 2014
                    exteriorColor: BLACK
                    mileage:
                      value: 56700
                      units: MI
                    status: USED
                    dates:
                      delivered: 2019-01-01
                      inService: 2014-01-01
                      warrantyExpiration: ""
                    ownerHref: https://api.fortellis.io/cdkdrive/crm/v1/customers/RGHH6755
                    primaryDriverHref: https://api.fortellis.io/cdkdrive/crm/v1/customers/AUHYG78835
                    links:
                      self:
                        href: https://api.fortellis.io/cdkdrive/service/vehicles/1234ABCD
                  properties:
                    vehicleId:
                      type: string
                      description: The idenifier of the vehicle record
                    identification:
                      description: Unique vehicle identifiers
                      type: object
                      required:
                        - vin
                      example:
                        vin: 5TFAW5F19EX759955
                        licensePlateNum: 1ABC123
                      properties:
                        vin:
                          type: string
                          description: The Vehicle Idenitification Number
                        licensePlateNum:
                          type: string
                          description: The vehicle license plate number
                    specification:
                      description: The make/model/year specification
                      type: object
                      required:
                        - makeCode
                        - modelCode
                        - modelYear
                      example:
                        makeCode: TOY
                        make: Toyota
                        modelCode: CAM
                        model: Camry
                        modelYear: 2017
                      properties:
                        makeCode:
                          type: string
                          description: The vehicle make code
                        make:
                          type: string
                          description: The vehicle make name
                        modelCode:
                          type: string
                          description: The vehicle model code
                        model:
                          type: string
                          description: The vehicle model name
                        modelYear:
                          type: number
                          description: The vehicle model year
                    exteriorColor:
                      type: string
                      description: The vehicle exterior color
                    mileage:
                      description: The vehicle mileage
                      type: object
                      required:
                        - value
                        - units
                      example:
                        value: 1024
                        units: KM
                      properties:
                        value:
                          type: number
                          description: The measurement value
                        units:
                          type: string
                          enum:
                            - MI
                            - KM
                          description: The units of measurement
                    status:
                      type: string
                      enum:
                        - NEW
                        - USED
                        - CERTIFIED
                      description: Is the status of the vehicle new, used, or certified?
                    dates:
                      description: Dates object
                      required:
                        - delivered
                        - inService
                      example:
                        delivered: 2019-01-01T00:00:00.000Z
                        inService: 2014-01-01T00:00:00.000Z
                        warrantyExpiration: 2020-01-01T00:00:00.000Z
                      properties:
                        delivered:
                          type: string
                          format: date
                          description: Delivery date of the vehicle to its current owner as defined by RFC
                            3339, section 5.6, for example, 2017-07-21
                        inService:
                          type: string
                          format: date
                          description: Retail sale date to the original owner as defined by RFC 3339,
                            section 5.6, for example, 2017-07-21
                        warrantyExpiration:
                          type: string
                          format: date
                          description: Warranty Expiration date of the vehicle as defined by RFC 3339,
                            section 5.6, for example, 2017-07-21
                    ownerHref:
                      type: string
                      description: The hyperlink to the owner customer resource
                    primaryDriverHref:
                      type: string
                      description: The hyperlink to the primary driver customer resource
                    links:
                      description: The hypermedia links of the customer resource
                      type: object
                      required:
                        - self
                      example:
                        self:
                          href: https://api.fortellis.io/cdkdrive/service/vehicles/1234ABCD
                      properties:
                        self:
                          description: Description links
                          title: Details of a link to a resource
                          type: object
                          required:
                            - href
                          example:
                            href: https://api.fortellis.io/cdkdrive/service/v1/vehicles/1234ABCD
                          properties:
                            href:
                              type: string
                              description: The target URI
                            method:
                              type: string
                              description: The HTTP verb that MUST be used to make a request to the target of
                                the link
                            title:
                              type: string
                              description: The title property provides a title for the link and is a helpful
                                documentation tool to facilitate understanding
                                by the end clients
            required:
              - items
            example:
              items:
                - vehicleId: 1234ABCD
                  identification:
                    vin: 5TFAW5F19EX759955
                    licensePlateNum: 1ABC123
                  specification:
