                type: string
              upType:
                description: Opportunity Source Up Type
                type: string
                enum:
                  - Campaign
                  - Internet
                  - Phone
                  - Showroom
                example: Internet
              isActive:
                description: true/false whether this company opportunity source is active
                type: boolean
              requestPhrase:
                description: (Future Use) Request phrase for the specified company opportunity
                  source
                type: string
              requiresSubSource:
                description: true/false whether this company opportunity source requires a
                  Subsource
                type: boolean
              hasSubSources:
                description: >
                  true/false whether this company opportunity source has subsources
                  (path to retrieve these subsources is in the HATEOAS links
                  collection)
                type: boolean
              links:
                description: A collection of HATEOAS links
                type: array
                items:
                  description: Object that describes link relations
                  type: object
                  properties:
                    href:
                      description: The target URI
                      type: string
                      example: https://api.fortellis.io/sales/v1/elead/productreferencedata/companyEmployees?positionName=Company%20Position%201
                    rel:
                      description: The link relation type
