responses:
  CompanyOpportunityStatusCollection:
    description: 200 - OK
    headers:
      Request-Id:
        type: string
      Preference-Applied:
        type: string
        enum:
          - return=representation
          - return=minimal
    schema:
      description: Object that describes a collection of company opportunity statuses
      type: object
      properties:
        items:
          description: A collection of company opportunity statuses
          type: array
          items:
            description: Object that describes a company opportunity status
            type: object
            properties:
              status:
                description: Company Opportunity Status Name
                type: string
              subStatuses:
                type: array
                items:
                  description: Object that describes a company opportunity sub status
                  type: object
                  properties:
                    subStatus:
                      description: Description of the sub status
                      type: string
                  required:
                    - subStatus
                  example:
                    subStatus: CRM Sold
            required:
              - status
            example:
              status: Sold
      required:
        - items
      example:
        items:
          - status: Active
            subStatuses:
              - subStatus: New
              - subStatus: Hot
          - status: Sold
            subStatuses:
              - subStatus: CRM Sold
              - subStatus: Fleet
  CompanyOpportunitySourceCollection:
    description: 200 - OK
    headers:
      Request-Id:
        type: string
      Preference-Applied:
        type: string
        enum:
          - return=representation
          - return=minimal
    schema:
      description: Object that describes a collection of company opportunity sources
      type: object
      properties:
        items:
          description: A collection of company opportunity sources
          type: array
          items:
            description: Object that describes a company opportunity source
            type: object
            properties:
              name:
