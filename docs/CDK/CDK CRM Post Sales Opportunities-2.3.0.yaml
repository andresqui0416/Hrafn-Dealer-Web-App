definitions:
  ActivityMessage:
    description: Object that describes an activity email message
    type: object
    properties:
      from:
        description: Sender's Email address
        type: string
      recipients:
        description: A collection of recipient email addresses
        type: array
        items:
          type: string
      carbonCopies:
        description: A collection of carbon copy email addresses
        type: array
        items:
          type: string
      subject:
        description: Subject of the email
        type: string
      body:
        description: Body of the email
        type: string
      isHtml:
        description: Is the body in HTML format?
        type: boolean
    required:
      - from
      - recipients
      - subject
      - body
      - isHtml
    example:
      from: first.last@email.com
      recipients:
        - first.person@email.com
        - next.person@email.com
      carbonCopies:
        - first.ccperson@email.com
      subject: Example Email Subject
      body: <h1>Headline</h1><p>Example email body</p>
      isHtml: true
  LinkDescriptionObject:
    description: Object that describes link relations
    type: object
    properties:
      href:
        description: The target URI
        type: string
      rel:
        description: The link relation type
        type: string
        example: create
      method:
        description: The HTTP verb that MUST be used to make a request to the target of
          the link
        type: string
        example: POST
      title:
        description: The title that describes the object
        type: string
        example: Create Opportunity
    required:
      - href
      - rel
      - method
      - title
    example:
      href: https://api.fortellis.io/sales/v1/elead/customers/89b07974-eb5b-441e-a7f8-d364a81430bc
      rel: self
      method: GET
      title: Get Customer
  OpportunitySalesStepCollection:
    description: Object that describes a collection of opportunity sales steps
    type: object
    properties:
      items:
        description: A collection of opportunity sales steps
        type: array
        items:
          description: Object that describes an opportunity sales step
          type: object
          properties:
            name:
              description: Sales step name
              type: string
              example: Step 1
            abbreviation:
              description: Abbreviation for the sales step name
              type: string
              example: S1
            isActive:
              description: true/false whether this sales step is active
              type: boolean
              example: true
            sortOrder:
              description: Intended order of the sales step if building a drop down in UI
              type: integer
              example: 0
          required:
            - name
            - abbreviation
            - isActive
            - sortOrder
          example:
            name: Step 1
            abbrevation: S1
            isActive: true
            sortOrder: 0
    required:
      - items
    example:
      items:
        - name: Step 1
          abbrevation: S1
          isActive: true
          sortOrder: 0
        - name: Step 2
          abbrevation: S2
          isActive: true
          sortOrder: 1
        - name: Step 3
          abbrevation: S3
          isActive: true
          sortOrder: 2
      links: []
  OpportunitySalesStep:
    description: Object that describes an opportunity sales step
    type: object
    properties:
      name:
        description: Sales step name
        type: string
        example: Step 1
      abbreviation:
        description: Abbreviation for the sales step name
        type: string
        example: S1
      isActive:
        description: true/false whether this sales step is active
        type: boolean
        example: true
      sortOrder:
        description: Intended order of the sales step if building a drop down in UI
        type: integer
        example: 0
    required:
      - name
      - abbreviation
      - isActive
      - sortOrder
    example:
      name: Step 1
      abbrevation: S1
      isActive: true
      sortOrder: 0
  SearchOpportunitiesResponse:
    description: Object that describes an opportunity search response
    type: object
    properties:
      items:
        description: A collection of opportunities
        type: array
        items:
          description: Object that describes an opportunity
          type: object
          properties:
            id:
              description: Unique identifier for this opportunity
              format: uuid
              type: string
            customer:
              description: Object that describes an opportunity customer
              type: object
              properties:
                id:
                  description: Unique identifier for this customer
                  format: uuid
                  type: string
                links:
                  description: A collection of HATEOAS links for this customer
                  type: array
                  items:
                    description: Object that describes link relations
                    type: object
                    properties:
                      href:
                        description: The target URI
                        type: string
                      rel:
                        description: The link relation type
                        type: string
                        example: create
                      method:
                        description: The HTTP verb that MUST be used to make a request to the target of
                          the link
                        type: string
                        example: POST
                      title:
                        description: The title that describes the object
                        type: string
                        example: Create Opportunity
                    required:
                      - href
                      - rel
                      - method
                      - title
                    example:
                      href: https://api.fortellis.io/sales/v1/elead/customers/89b07974-eb5b-441e-a7f8-d364a81430bc
                      rel: self
                      method: GET
                      title: Get Customer
              required:
                - id
                - links
              example:
                id: 89b07974-eb5b-441e-a7f8-d364a81430bc
                links:
                  - href: https://api.fortellis.io/sales/v1/elead/customers/89b07974-eb5b-441e-a7f8-d364a81430bc
                    rel: self
                    method: GET
                    title: Get Customer
                  - href: https://api.fortellis.io/sales/v1/elead/customers
                    rel: create
                    method: POST
                    title: Create Customer
                  - href: https://api.fortellis.io/sales/v1/elead/customers/89b07974-eb5b-441e-a7f8-d364a81430bc
                    rel: update
                    method: POST
                    title: Update Customer
