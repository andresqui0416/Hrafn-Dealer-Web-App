    post:
      summary: Send an email and create the corresponding activity
      description: Sends an email and creates the corresponding activity
      tags:
        - Opportunities
      operationId: Opportunities_SendEmail
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: Accept
          in: header
          required: false
          type: string
          enum:
            - application/json
          description: This header describes the characters that the API will accept.
        - name: Accept-Charset
          in: header
          required: false
          type: string
          enum:
            - utf-8
          description: This header describes the characters that the client will accept.
        - name: Prefer
          in: header
          required: false
          type: string
          format: enum
          enum:
            - return=minimal
            - return=representation
          description: This header describes the preferences of the client calling the API.
        - name: Request-Id
          in: header
          required: true
          type: string
          description: A correlation ID that should be returned to the caller to indicate
            the return of the given request
        - name: request
          in: body
          required: true
          description: The send email request model
          schema:
            description: Object that describes a send email request
            type: object
            properties:
              opportunityId:
                description: Unique idenitifer of the opportunity
                format: uuid
                type: string
              message:
                description: Object that describes an activity email message
                type: object
                properties:
                  from:
                    description: Sender's Email address
                    type: string
                  recipients:
                    description: A collection of recipient email addresses
                    type: array
                    items:
                      type: string
                  carbonCopies:
                    description: A collection of carbon copy email addresses
                    type: array
                    items:
                      type: string
                  subject:
                    description: Subject of the email
                    type: string
                  body:
                    description: Body of the email
                    type: string
                  isHtml:
                    description: Is the body in HTML format?
                    type: boolean
                required:
                  - from
                  - recipients
                  - subject
                  - body
                  - isHtml
                example:
                  from: first.last@email.com
                  recipients:
                    - first.person@email.com
                    - next.person@email.com
                  carbonCopies:
                    - first.ccperson@email.com
                  subject: Example Email Subject
                  body: <h1>Headline</h1><p>Example email body</p>
                  isHtml: true
              activityTypeId:
