                          type: string
                          description: Can be street, avenue, road, etc. This element also includes the
                            house number and room/apartment/flat/floor number.
                        city:
                          type: string
                          description: Can be city, village, town, borough, etc. This is the postal town
                            and not necessarily the place of residence or place
                            of business.
