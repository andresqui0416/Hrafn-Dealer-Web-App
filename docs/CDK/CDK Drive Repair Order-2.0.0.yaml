                    type: string
                    description: Part number description
                  mfrCode:
                    type: string
                    description: Manufacturer code
                  partQty:
                    type: number
                    description: Part quantity
                  saleAmount:
                    type: number
                    description: Sale amount
                  fixedSaleFlag:
                    type: boolean
                    description: >
                      Flag that indicates if the unit sale amount is a fixed price. If
                      so, the Parts 

                      application will not re-price the part.
                  includesCoreFlag:
                    type: boolean
                    description: >
                      Flag that indicates if the core amount is included in the unit sale
                      amount
                required:
                  - partNumber
                  - partNumberDescription
                  - mfrCode
                  - partQty
                  - saleAmount
                  - fixedSaleFlag
                  - includesCoreFlag
                example:
                  fixedSaleFlag: false
                  includesCoreFlag: false
                  mfrCode: FR
                  partNumber: P9488
                  partNumberDescription: CLUTCH PLATE
                  partQty: 1
                  saleAmount: 30
              description: >
                The included parts specified to be used or consumed as part of the
                labor operation
            saleAmount:
              type: number
              description: Sale amount. Required if SaleOverride is true. Ignored if false.
            saleOverrideFlag:
              type: boolean
              description: Flag that indicates if the sale amount overrides any calculated
                amount
            shopCharge:
              type: number
              description: >
                Shop charge amount that overrides a calculated shop
                charge.  Required if ForceShopCharge

                is true. Ignored if false.
            forceShopChargeFlag:
              type: boolean
              description: Flag that indicates if the shop charge overrides any calculated
                amount
            soldHours:
              type: number
              description: Sold hours
          required:
            - forceShopChargeFlag
            - opCode
            - opCodeDesc
            - saleOverrideFlag
            - soldHours
            - saleAmount
