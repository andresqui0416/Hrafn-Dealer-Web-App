definitions:
  GetRepairOrder:
    description: Get Repair Order response
    type: object
    properties:
      repairOrderId:
        type: string
        description: The repair order's unique identifier
      blockIVRFlag:
        type: boolean
        description: Flag that indicates Integrated Voice Response (IVR) or Customer
          Touch messages
      comments:
        type: string
        description: Repair order comments
      customerHref:
        type: string
        description: The hyperlink to the Customer associated resource
      customerContactInfo:
        type: string
        description: >
          Phone number or e-mail address given during write-up in which to
          contact the customer. 

          Phone numbers can include an extension.  This takes priority over contact information 

          recorded in the Customer resource located at customerHref.
      vehicleHref:
        type: string
        description: The hyperlink to the Vehicle associated resource
      dispatchMakeCode:
        type: string
        description: Make code required for dispatching
      dropOff:
        description: Customer drop off details.  Only valid when transportType is set to
          SHUTTLE.
        type: object
        properties:
          dateTime:
            type: string
            description: The date and time for dropoff in format YYYY-MM-DDTHH:MM:SS
          address:
            type: string
            description: Address at which the customer will be dropped off
          city:
            type: string
            description: City in which the customer will be dropped off
          note:
            type: string
            description: Additional notes regarding the customer drop off request
          phone:
            type: string
            description: Phone number where the customer can be reached
          vanNumber:
            type: string
            description: Van number used to drop off the customer
        example:
          dateTime: 2018-08-12T20:19:45
          address: 678 Montgomery St
          city: Jersey City
          phone: "8302852330"
          vanNumber: 830-285-2330
      pickUp:
        description: Customer pick up details.  Only valid when transportType is set to
          SHUTTLE.
        type: object
        properties:
          dateTime:
            type: string
            description: The date and time of pickup in format YYYY-MM-DDTHH:MM:SS
          address:
            type: string
            description: Address of pickup
          city:
            type: string
            description: City of pickup
          note:
            type: string
            description: Note
          phone:
            type: string
            description: Phone number for pickup
          vanNumber:
            type: string
            description: Van number
        example:
          dateTime: 2018-08-12T20:17:45
          address: 678 Montgomery St
          city: Jersey City
          note: Call before pickup
          phone: 830-285-2330
          vanNumber: 830-285-2330
      estimate:
        description: The authorized service estimate for the repair order
        type: object
        properties:
          estimateOverrideFlag:
            type: boolean
            description: |
              Indicates whether the RO level estimates have been 
              overridden
          authorized:
            type: number
            description: |
              The authorized service estimate for the repair order
          labor:
            type: number
            description: Total labor estimate for the repair order
          parts:
            type: number
            description: Total parts estimate for the repair order
          misc:
            type: number
            description: Total miscellaneous estimate for the repair order
          lube:
            type: number
            description: Total lube estimate for the repair order
          sublet:
            type: number
            description: Total sublet estimate for the repair order
          tax:
            type: number
            description: Total tax estimate for the repairs
        example:
          estimateOverrideFlag: false
          authorized: 200
          labor: 80
          parts: 40
          misc: 30
          lube: 30
          sublet: 10
          tax: 10
      mileageIn:
        description: Mileage measurement when the vehicle arrived for service
        properties:
          value:
            type: number
            description: The measurement value
          units:
            type: string
            enum:
              - MI
              - KM
              - HR
            description: The units of measurement
        required:
          - value
          - units
        example:
          value: 1000
          units: MI
      poNumber:
        type: string
        description: Purchase order number.
      promiseDateTime:
        type: string
        description: >
          Promised date and time (in format YYYY-MM-DDTHH:MM:SS) for
          returning the vehicle back to 

          the customer
      remarks:
        type: string
        description: Remarks
      serviceAdvisorId:
        type: string
        description: Service advisor identifier
      serviceLineItems:
        type: array
        items:
          description: Get Service Line response
          properties:
            serviceLineId:
              type: string
              description: Unique key for a service request (line)
            serviceRequest:
              type: string
              description: Service request description
            jobStarted:
              type: boolean
              description: Indicates whether work on this service line has been started by a
                technician. If true then work has already started and this
                service line does not support updates. If False, work has not
                yet started and this service line supports updates.
            cause:
              type: string
              description: Description of what caused the customer's complaint
            comebackFlag:
              type: boolean
              description: Flag that indicates if the repair line is a comeback
            dispatchCode:
              type: string
              description: >
                Dispatch code. Note that this field is the code that comes after
                the first character of 

                the item ids of the DISPATCH-CODES file. I.E. The DispatchMakeCode and linDispatchCode 

                are joined together to validate the dispatch code in the DISPATCH-CODES file.
            estimatedDuration:
              type: number
              description: Estimated duration of the service request (line)
            technicianId:
              type: string
              description: Technician identifier
            laborOperations:
              type: array
              items:
                description: Labor Operations response object
                properties:
                  laborOperationId:
                    type: string
                    description: Labor operation unique identifier
                  opCode:
                    type: string
                    description: Labor operation code
                  opCodeDesc:
                    type: string
                    description: Labor operation code description
                  laborType:
                    type: string
                    description: Labor type code
                  includedParts:
                    type: array
                    items:
                      description: Part refs response object
                      properties:
                        partRefId:
                          type: string
                          description: Part reference unique identifier
                        partNumber:
                          type: string
                          description: Preassigned part number
                        partNumberDescription:
                          type: string
                          description: Part number description
                        mfrCode:
                          type: string
                          description: Manufacturer code
                        partQty:
                          type: number
                          description: Part quantity
                        saleAmount:
                          type: number
                          description: Sale amount
                        fixedSaleFlag:
                          type: boolean
                          description: >
                            Flag that indicates if the unit sale amount is a fixed price. If
                            so, the Parts 

                            application will not re-price the part.
                        includesCoreFlag:
                          type: boolean
                          description: >
                            Flag that indicates if the core amount is included in the unit sale
                            amount
                      required:
                        - partNumber
                        - partNumberDescription
                        - mfrCode
                        - partQty
                        - saleAmount
                        - fixedSaleFlag
                        - includesCoreFlag
                      example:
                        partRefId: "1"
                        fixedSaleFlag: false
                        includesCoreFlag: false
                        mfrCode: FR
                        partNumber: P9488
                        partNumberDescription: CLUTCH PLATE
                        partQty: 1
                        saleAmount: 30
                    description: >
                      The included parts specified to be used or consumed as part of the 

                      specification
                  saleAmount:
                    type: number
                    description: >
                      Sale amount. Required if SaleOverride is true. Ignored if false.
                  saleOverrideFlag:
                    type: boolean
                    description: >
                      Flag that indicates if the sale amount overrides any calculated 

                      amount
                  shopCharge:
                    type: number
                    description: >
                      Shop charge amount that overrides a calculated shop
                      charge.  Required if ForceShopCharge 

                      is true. Ignored if false.
                  forceShopChargeFlag:
                    type: boolean
                    description: >
                      Flag that indicates if the shop charge overrides any calculated
                      amount
                  soldHours:
                    type: number
                    description: Sold hours. Required.
                required:
                  - forceShopChargeFlag
                  - opCode
                  - opCodeDesc
                  - saleOverrideFlag
                  - soldHours
                  - saleAmount
                example:
                  laborOperationId: "11"
                  forceShopChargeFlag: false
                  laborType: CEC
                  opCode: SSTR
                  opCodeDesc: CLUTCH REPAIR
                  soldHours: 0.2
                  saleAmount: 7
                  saleOverrideFlag: false
                  includedParts:
                    - partRefId: "1"
                      fixedSaleFlag: false
                      includesCoreFlag: false
                      mfrCode: FR
                      partNumber: P9488
                      partNumberDescription: CLUTCH PLATE
                      partQty: 4
                      saleAmount: 30
                    - partRefId: "2"
                      fixedSaleFlag: false
                      includesCoreFlag: false
                      mfrCode: FR
                      partNumber: "7488"
                      partNumberDescription: RETAINER CIRCLIP
                      partQty: 1
                      saleAmount: 5
            laborType:
              type: string
              description: Labor type code
            laborEstimate:
              type: number
              description: Total labor estimate for the service request (line)
            lubeEstimate:
              type: number
              description: Total lube estimate for the service request (line)
            miscEstimate:
              type: number
              description: Total miscellaneous estimate for the service request (line)
            partsEstimate:
              type: number
              description: Total parts estimate for the service request (line)
            serviceEstimate:
              type: number
              description: Total service estimate for the service request (line)
            subletEstimate:
              type: number
              description: Total sublet estimate for the service request (line)
            taxEstimate:
              type: number
              description: Total tax estimate for the service request (line)
            status:
              description: Service line status code and description
              properties:
                code:
                  type: string
                  description: The status code
                description:
                  type: string
                  description: Description of the status
              example:
                code: I93
                description: PREASSIGNED
          required:
            - serviceLineId
            - serviceRequest
            - jobStarted
            - laborOperations
            - estimatedDuration
          example:
            serviceLineId: "123"
            cause: Braking issue
            jobStarted: true
            comebackFlag: false
            dispatchCode: S104
            estimatedDuration: 1.5
            laborEstimate: 10
            laborType: CEC
            lubeEstimate: 10
            miscEstimate: 10
            partsEstimate: 10
            serviceEstimate: 10
            status:
              code: I93
              description: PREASSIGNED
            serviceRequest: CUSTOMER STATES THERE IS A CLUNKING SOUND IN FRONT END OVER BUMPS
            subletEstimate: 10
            taxEstimate: 10
            technicianId: "253"
            laborOperations:
              - laborOperationId: "11"
                forceShopChargeFlag: false
                laborType: CEC
                opCode: SSTR
                opCodeDesc: SUSPENSION AND STEERING REPAIR
                soldHours: 0.2
                saleAmount: 7
                saleOverrideFlag: false
                includedParts:
                  - partRefId: "1"
                    fixedSaleFlag: false
                    includesCoreFlag: false
                    mfrCode: FR
                    partNumber: P9488
                    partNumberDescription: CLUTCH PLATE
                    partQty: 1
                    saleAmount: 30
                  - partRefId: "2"
                    fixedSaleFlag: false
                    includesCoreFlag: false
                    mfrCode: FR
                    partNumber: "7488"
                    partNumberDescription: BRAKEPAD
                    partQty: 2
                    saleAmount: 50
