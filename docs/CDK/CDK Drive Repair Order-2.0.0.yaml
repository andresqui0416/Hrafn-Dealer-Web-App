swagger: "2.0"
info:
  version: 2.0.0
  title: CDK Drive Repair Order
  description: >
    ## CDK Drive - Service - Repair Orders

    A repair order is a working record of a the work carried out by the service department on a 

    vehicle. This could be any set of services, repairs, body repairs, government tests etc. This 

    version is specific to CDK Drive.


    ## What does this API do?

    The API will allow you to query, retrieve, create and update repair orders.


    ## Intended Audience

    It is expected that service applications used by service advisors, technicians, and service 

    managers  will use this service to find, open, update, and review repair orders.
basePath: /service/cdk-drive/v2/repair-orders
securityDefinitions:
  permission-model:
    type: oauth2
    flow: implicit
    authorizationUrl: https://identity.fortellis.io/oauth2/
schemes:
  - https
tags:
  - name: Repair Order
paths:
  /:
    get:
      summary: Query open repair orders
      description: >
        Query open repair orders for a given service advisors, customer or
        vehicleId
      operationId: queryRepairOrders
      tags:
        - repair order
      parameters:
        - name: Request-Id
          in: header
          required: true
          type: string
          format: guid
          description: >
            A correlation ID that should be returned back to the caller to
            indicate the return of the 

            given request
        - name: serviceAdvisorId
          in: query
          required: false
          type: string
          description: The unique identifier of the assigned ServiceAdvisor
        - name: vehicleId
          in: query
          required: false
          type: string
          description: The unique identifier of the vehicle
        - name: customerId
          in: query
          required: false
          type: string
          description: The unique identifier of the customer
        - &a1
          name: Subscription-Id
          in: header
          description: The Fortellis Marketplace subscription identifier between a user
            entity and the app.
          required: true
          type: string
          default: test
        - &a2
          name: Authorization
          in: header
          description: Provides authorization to access Fortellis APIs. For calling a
            Fortellis Provider, this must be an OAuth 2.0 token issued by the
            Fortellis authorization server.
          required: true
          type: string
          disabled: true
          placeholder: Automatically set
      produces:
        - application/json
      consumes:
        - application/json
      responses:
        "200":
          description: OK
          headers:
            Request-Id:
              type: string
          schema:
            description: Repair Order Collections
            type: object
            properties:
              items:
                type: array
                items:
                  description: Repair Order summary object
                  type: object
                  required:
                    - repairOrderId
                    - vehicleHref
                    - tagNum
                    - customerHref
                    - customerContactInfo
                    - comments
                    - serviceAdvisorId
                    - remarks
                    - serviceLineSummary
                    - promiseDateTime
                    - status
                    - links
                  example:
                    repairOrderId: "67307"
                    vehicleHref: https://api.fortellis.io/cdkdrive/service/vehicles/4G263088
                    customerHref: https://api.fortellis.io/cdkdrive/crm/v1/customers/800245
                    status:
                      code: I93
                      description: PREASSIGNED
                    serviceAdvisorId: "3354"
                    serviceLineSummary:
                      - serviceRequest: CUSTOMER STATES THERE IS A CLUNKING SOUND IN FRONT END OVER
                          BUMPS
                        estimatedDuration: 1.5
                    tagNum: "9898"
                    repairOrderEstimate:
                      authorized: 50
                    customerContactInfo: "8302852330"
                    promiseDateTime: 2018-08-12T20:17:45
                    comments: Use synthetic 5W-20 engine oil
                    remarks: sample remarks
                    links:
                      self:
                        href: https://api.fortellis.io/cdkdrive/service/v1/repair-orders/123
                  properties:
                    repairOrderId:
                      type: string
                      description: The repair order's unique identifier
                    vehicleHref:
                      type: string
                      description: The hyperlink to the Vehicle associated resource
                    tagNum:
                      type: string
                      description: Tag number assigned to the vehicle while it is being repaired
                    customerHref:
                      type: string
                      description: The hyperlink to the Customer associated resource
                    customerContactInfo:
                      type: string
                      description: >
                        Phone number or e-mail address given during write-up in which to
                        contact the customer. 

                        Phone numbers can include an extension.  This takes priority over contact information 

                        recorded in the Customer resource located at customerHref.
                    comments:
                      type: string
                      description: Customer comments
                    serviceAdvisorId:
                      type: string
                      description: Service advisor number
                    remarks:
                      type: string
                      description: Service advisor remarks
                    serviceLineSummary:
                      type: array
                      description: The service line items summary
                      items:
                        description: Service Line summary object
                        example:
                          serviceRequest: CUSTOMER STATES THERE IS A CLUNKING SOUND IN FRONT END OVER
                            BUMPS
                          estimatedDuration: 1.5
                        properties:
                          serviceRequest:
                            type: string
                            description: Service request description
                          estimatedDuration:
                            type: number
                            description: Estimated duration of the service request (line).  Required for
                              Dispatching.
                    repairOrderEstimate:
                      description: The authorized estimate for the repair order
                      type: object
                      example:
                        authorized: 50
                      properties:
                        authorized:
                          type: number
                          description: The authorized estimate for the repair order
                    promiseDateTime:
                      type: string
                      description: >
                        Promised date and time (in format YYYY-MM-DDTHH:MM:SS) for
                        returning the vehicle back 

                        to the customer.
                    status:
                      description: Repair Order status code and description
                      example:
                        code: I93
                        description: PREASSIGNED
                      properties:
                        code:
                          type: string
                          description: The status code
                        description:
                          type: string
                          description: Description of the status
                    links:
                      description: The hypermedia links of the repair order resource
                      type: object
                      required:
                        - self
                      example:
                        self:
                          href: https://api.fortellis.io/cdkdrive/service/v1/repair-orders/123
                      properties:
                        self:
                          description: The canonical link to the repair order resource
                          type: object
                          required:
                            - href
                          example:
                            href: https://api.fortellis.io/cdkdrive/service/v1/repair-orders/123
                            method: GET
                          properties:
                            href:
                              type: string
                              description: The target URI
                            rel:
                              type: string
                              description: The link relation type
                            method:
                              type: string
                              description: The HTTP verb that MUST be used to make a request to the target of
                                the link
                            title:
                              type: string
                              description: A human readable title for the link that conveys the purpose of the
                                link
            required:
              - items
            example:
              items:
                - repairOrderId: "123"
                  vehicleHref: https://api.fortellis.io/cdkdrive/service/vehicles/4G263088
                  customerHref: https://api.fortellis.io/cdkdrive/crm/v1/customers/800245
                  status:
                    code: I93
                    description: PREASSIGNED
                  serviceAdvisorId: "3354"
                  serviceLineSummary:
                    - serviceRequest: CUSTOMER STATES THERE IS A CLUNKING SOUND IN FRONT END OVER
                        BUMPS
                      estimatedDuration: 1.5
                  tagNum: "9898"
                  repairOrderEstimate:
                    authorized: 50
                  customerContactInfo: "8302852330"
                  promiseDateTime: 2018-08-12T20:17:45
                  comments: Use synthetic 5W-20 engine oil
                  remarks: sample remarks
                  links:
                    self:
                      href: https://api.fortellis.io/cdkdrive/service/v1/repair-orders/123
                  startDate: 2020-05-06
                  endDate: 2020-05-06
        "400":
          description: 400 - Bad Request
          headers:
            Request-Id:
              type: string
          schema:
            description: Bad Request Error response
            type: array
            items:
              type: object
              properties:
                code:
                  type: integer
                  description: The error code
                message:
                  type: string
                  description: The error message
            required:
              - code
              - message
            example:
              - code: 400
                message: Bad Request
        "401":
          description: 401 - Unauthorized
          headers:
            Request-Id:
              type: string
          schema:
            description: Unauthorized Error response
            type: array
            items:
              type: object
              properties:
                code:
                  type: integer
                  description: The error code
                message:
                  type: string
                  description: The error message
            required:
              - code
              - message
            example:
              - code: 401
                message: Unauthorized
        "403":
          description: 403 - Forbidden
          headers:
            Request-Id:
              type: string
          schema:
            description: Frobidden Error response
            type: array
            items:
              type: object
              properties:
                code:
                  type: integer
                  description: The error code
                message:
                  type: string
                  description: The error message
            required:
              - code
              - message
            example:
              - code: 403
                message: Forbidden
        "404":
          description: 404 - Not Found
          headers:
            Request-Id:
              type: string
          schema:
            description: Not found Error response
            type: array
            items:
              type: object
              properties:
                code:
                  type: integer
                  description: The error code
                message:
                  type: string
                  description: The error message
            required:
              - code
              - message
            example:
              - code: 404
                message: Not found
    post:
      summary: Create repair order
      description: Create a repair order
      operationId: createRepairOrder
      tags:
        - repair order
      parameters:
        - name: Request-Id
          in: header
          required: true
          type: string
          format: guid
          description: >
            A correlation ID that should be returned back to the caller to
            indicate the return of the 

            given request
        - name: CreateRepairOrder
          in: body
          description: The repair order information
          required: true
          schema:
            description: Create Repair Order request
            type: object
            properties:
              appointmentId:
                type: string
                description: The appointment that will be rolled into the repair order
              blockIVRFlag:
                type: boolean
                description: Flag that indicates Integrated Voice Response (IVR) or Customer
                  Touch messages
              comments:
                type: string
                description: Repair order comments
              customerHref:
                type: string
                description: The hyperlink to the Customer associated resource
              customerContactInfo:
                type: string
                description: >
                  Phone number or e-mail address given during write-up in which to
                  contact the customer. 

                  Phone numbers can include an extension.  This takes priority over contact information 

                  recorded in the Customer resource located at customerHref.
              vehicleHref:
                type: string
                description: The hyperlink to the Vehicle associated resource
              dispatchMakeCode:
                type: string
                description: Make code required for dispatching.
              dropOff:
                description: Customer drop off details.  Only valid when transportType is set to
                  SHUTTLE.
                type: object
                properties:
                  dateTime:
                    type: string
                    description: The date and time for dropoff in format YYYY-MM-DDTHH:MM:SS
                  address:
                    type: string
                    description: Address at which the customer will be dropped off
                  city:
                    type: string
                    description: City in which the customer will be dropped off
                  note:
                    type: string
                    description: Additional notes regarding the customer drop off request
                  phone:
                    type: string
                    description: Phone number where the customer can be reached
                  vanNumber:
                    type: string
                    description: Van number used to drop off the customer
                example:
                  dateTime: 2018-08-12T20:19:45
                  address: 678 Montgomery St
                  city: Jersey City
                  phone: "8302852330"
                  vanNumber: 830-285-2330
              pickUp:
                description: Customer pick up details.  Only valid when transportType is set to
                  SHUTTLE.
                type: object
                properties:
                  dateTime:
                    type: string
                    description: The date and time of pickup in format YYYY-MM-DDTHH:MM:SS
                  address:
                    type: string
                    description: Address of pickup
                  city:
                    type: string
                    description: City of pickup
                  note:
                    type: string
                    description: Note
                  phone:
                    type: string
                    description: Phone number for pickup
                  vanNumber:
                    type: string
                    description: Van number
                example:
                  dateTime: 2018-08-12T20:17:45
                  address: 678 Montgomery St
                  city: Jersey City
                  note: Call before pickup
                  phone: 830-285-2330
                  vanNumber: 830-285-2330
              estimate:
                description: The authorized service estimate for the repair order
                type: object
                properties:
                  authorized:
                    type: number
                    description: The authorized service estimate for the repair order
                  labor:
                    type: number
                    description: Total labor estimate for the repair order
                  parts:
                    type: number
                    description: Total parts estimate for the repair order
                  misc:
                    type: number
                    description: Total miscellaneous estimate for the repair order
                  lube:
                    type: number
                    description: Total lube estimate for the repair order
                  sublet:
                    type: number
                    description: Total sublet estimate for the repair order
                  tax:
                    type: number
                    description: Total tax estimate for the repairs
                example:
                  authorized: 200
                  labor: 80
                  parts: 40
                  misc: 30
                  lube: 30
                  sublet: 10
                  tax: 10
              mileageIn:
                description: Mileage measurement when the vehicle arrived for service
                properties:
                  value:
                    type: number
                    description: The measurement value
                  units:
                    type: string
                    enum:
                      - MI
                      - KM
                      - HR
                    description: The units of measurement
                required:
                  - value
                  - units
                example:
                  value: 1000
                  units: MI
              poNumber:
                type: string
                description: Purchase order number
              promiseDateTime:
                type: string
                description: >
                  Promised date and time (in format YYYY-MM-DDTHH:MM:SS) of when the
                  requested services 

                  will be complete
              remarks:
                type: string
                description: Remarks
              serviceAdvisorId:
                type: string
                description: Service advisor number
              serviceLineItems:
                type: array
                items:
                  description: ServiceLine Item
                  properties:
                    serviceRequest:
                      type: string
                      description: Service request description
                    cause:
                      type: string
                      description: Description of what caused the customer's complaint
                    comebackFlag:
                      type: boolean
                      description: Flag that indicates if the repair line is a comeback
                    dispatchCode:
                      type: string
                      description: >
                        Dispatch code. Required if using a CDK Drive Dispatching/ERO
                        system. Optional if using a CDK Drive ROI

                        system. Note that this field is the code that comes after the first character of the item ids of the

                        DISPATCH-CODES file. I.E. The DispatchMakeCode and linDispatchCode are joined together to validate the

                        dispatch code in the DISPATCH-CODES file.
                    estimatedDuration:
                      type: number
                      description: Estimated duration of the service request (line).  Required for
                        Dispatching.
                    technicianId:
                      type: string
                      description: Technician identifier
                    laborOperations:
                      type: array
                      items:
                        description: Create and Update Labor Operations request
                        properties:
                          opCode:
                            type: string
                            description: Labor operation code
                          opCodeDesc:
                            type: string
                            description: Labor operation code description
                          laborType:
                            type: string
                            description: Labor type code
                          includedParts:
                            type: array
                            items:
                              description: Create and Update Part Refs request
                              properties:
                                partNumber:
                                  type: string
                                  description: Preassigned part number
                                partNumberDescription:
                                  type: string
                                  description: Part number description
                                mfrCode:
                                  type: string
                                  description: Manufacturer code
                                partQty:
                                  type: number
                                  description: Part quantity
                                saleAmount:
                                  type: number
                                  description: Sale amount
                                fixedSaleFlag:
                                  type: boolean
                                  description: >
                                    Flag that indicates if the unit sale amount is a fixed price. If
                                    so, the Parts 

                                    application will not re-price the part.
                                includesCoreFlag:
                                  type: boolean
                                  description: >
                                    Flag that indicates if the core amount is included in the unit sale
                                    amount
                              required:
                                - partNumber
                                - partNumberDescription
                                - mfrCode
                                - partQty
                                - saleAmount
                                - fixedSaleFlag
                                - includesCoreFlag
                              example:
                                fixedSaleFlag: false
                                includesCoreFlag: false
                                mfrCode: FR
                                partNumber: P9488
                                partNumberDescription: CLUTCH PLATE
                                partQty: 1
                                saleAmount: 30
                            description: >
                              The included parts specified to be used or consumed as part of the
                              labor operation
                          saleAmount:
                            type: number
                            description: Sale amount. Required if SaleOverride is true. Ignored if false.
                          saleOverrideFlag:
                            type: boolean
                            description: Flag that indicates if the sale amount overrides any calculated
                              amount
                          shopCharge:
                            type: number
                            description: >
                              Shop charge amount that overrides a calculated shop
                              charge.  Required if ForceShopCharge

                              is true. Ignored if false.
                          forceShopChargeFlag:
                            type: boolean
                            description: Flag that indicates if the shop charge overrides any calculated
                              amount
                          soldHours:
                            type: number
                            description: Sold hours
                        required:
                          - forceShopChargeFlag
                          - opCode
                          - opCodeDesc
                          - saleOverrideFlag
                          - soldHours
                          - saleAmount
                        example:
                          forceShopChargeFlag: false
                          laborType: CEC
                          opCode: SSTR
                          opCodeDesc: CLUTCH REPAIR
                          soldHours: 0.2
                          saleAmount: 7
                          saleOverrideFlag: false
                          includedParts:
                            - partRefId: "1"
                              fixedSaleFlag: false
                              includesCoreFlag: false
                              mfrCode: FR
                              partNumber: P9488
                              partNumberDescription: CLUTCH PLATE
                              partQty: 4
                              saleAmount: 30
                            - partRefId: "2"
                              fixedSaleFlag: false
                              includesCoreFlag: false
                              mfrCode: FR
                              partNumber: "7488"
                              partNumberDescription: RETAINER CIRCLIP
                              partQty: 1
                              saleAmount: 5
                    laborType:
                      type: string
                      description: Labor type code
                    laborEstimate:
                      type: number
                      description: Total labor estimate for the service line
                    lubeEstimate:
                      type: number
                      description: Total lube estimate for the service line
                    miscEstimate:
                      type: number
                      description: Total miscellaneous estimate for the service line
                    partsEstimate:
                      type: number
                      description: Total parts estimate for the service line
                    serviceEstimate:
                      type: number
                      description: Total service estimate for the service line
                    subletEstimate:
                      type: number
                      description: Total sublet estimate for the service line
                    taxEstimate:
                      type: number
                      description: Total tax estimate for the service line
                  required:
                    - serviceRequest
                    - laborOperations
                    - estimatedDuration
                  example:
                    cause: Unusual sound occurring when clutch is engaged
                    comebackFlag: false
                    dispatchCode: S102
                    estimatedDuration: 1.5
                    laborEstimate: 10
                    laborType: CEC
                    lubeEstimate: 10
                    miscEstimate: 10
                    partsEstimate: 10
                    serviceEstimate: 10
                    serviceRequest: Investigate sound coming from clutch
                    subletEstimate: 10
                    taxEstimate: 10
                    technicianId: "253"
                    laborOperations:
                      - forceShopChargeFlag: false
                        laborType: CEC
                        opCode: SSTR
                        opCodeDesc: SUSPENSION AND STEERING REPAIR
                        soldHours: 0.2
                        saleAmount: 7
                        saleOverrideFlag: false
                description: The service line items
              tagNum:
                type: string
                description: Tag number assigned to the vehicle while it is being repaired
              transportType:
                type: string
                enum:
                  - CAB
                  - LOANER
                  - RENTAL
                  - SHUTTLE
                  - DROPOFF
                  - WAITER
                description: Transportation type
              workorder:
                description: Create Work Order object
                properties:
                  printWorkorder:
                    type: boolean
                    description: Flag indicates if a workorder should be printed for a new Repair
                      Order. Note if RO Printing Optionial Flag in DMS is set to
                      N, then Drive will automatically change this
                      printWorkorder flag to true.
                  workorderPrinter:
                    type: string
                    description: Printer number to use for printing the work order
                  workorderCopies:
                    type: string
                    description: Number of copies of the workorder to print
                  partsPrinter:
                    type: string
                    description: Name of the printer to use for printing the pre-assigned parts
                      report.
                example:
                  printWorkorder: true
                  workorderPrinter: "1"
                  workorderCopies: "1"
                  partsPrinter: L99999
            required:
              - customerHref
              - customerContactInfo
              - vehicleHref
              - mileageIn
              - promiseDateTime
              - serviceAdvisorId
              - serviceLineItems
              - tagNum
            example:
              appointmentId: "8888"
              blockIVRFlag: false
              comments: Use synthetic 5W-20 engine oil
              customerHref: https://api.fortellis.io/cdkdrive/crm/v1/customers/800245
              vehicleHref: https://api.fortellis.io/cdkdrive/service/vehicles/4G263088
              dispatchMakeCode: C
              customerContactInfo: "8302852330"
              dropOff:
                dateTime: 2018-08-12T20:13:45
                address: 678 Montgomery St
                city: Jersey City
                note: Call before pickup
                phone: "8302852330"
                vanNumber: "8302852330"
              estimate:
                authorized: 200
                labor: 80
                parts: 40
                misc: 30
                lube: 30
                sublet: 10
                tax: 10
              mileageIn:
                value: 87665
                units: MI
              pickUp:
                dateTime: 2018-08-12T20:19:45
                address: 678 Montgomery St
                city: Jersey City
                note: Call before pickup
                phone: "8302852330"
                vanNumber: "8302852330"
              promiseDateTime: 2018-08-12T20:17:45
              serviceAdvisorId: "6164"
              tagNum: "3088"
              remarks: sample remarks
              transportType: DROPOFF
              serviceLineItems:
                - cause: Braking issue
                  comebackFlag: false
                  dispatchCode: S104
                  estimatedDuration: 1.5
                  laborEstimate: 10
                  laborType: CEC
                  lubeEstimate: 10
                  miscEstimate: 10
                  partsEstimate: 10
                  serviceEstimate: 10
                  serviceRequest: CUSTOMER STATES THERE IS A CLUNKING SOUND IN FRONT END OVER
                    BUMPS
                  subletEstimate: 10
                  taxEstimate: 10
                  technicianId: "253"
                  laborOperations:
                    - forceShopChargeFlag: false
                      laborType: CEC
                      opCode: SSTR
                      opCodeDesc: SUSPENSION AND STEERING REPAIR
                      soldHours: 0.2
                      saleAmount: 7
                      saleOverrideFlag: false
                      includedParts:
                        - fixedSaleFlag: false
                          includesCoreFlag: false
                          mfrCode: FR
                          partNumber: P9488
                          partNumberDescription: CLUTCH PLATE
                          partQty: 1
                          saleAmount: 30
                        - fixedSaleFlag: false
                          includesCoreFlag: false
                          mfrCode: FR
                          partNumber: "7488"
                          partNumberDescription: BRAKEPAD
                          partQty: 2
                          saleAmount: 50
              workorder:
                printWorkorder: true
                workorderPrinter: "1"
                workorderCopies: "1"
                partsPrinter: L99999
        - *a1
        - *a2
      produces:
        - application/json
      consumes:
        - application/json
      responses:
        "201":
          description: OK
          headers:
            Request-Id:
              type: string
            ETag:
              type: string
              description: The computed checksum of the resource
          schema:
            description: Repair Order response
            type: object
            properties:
              repairOrderId:
                type: string
                description: The repair order's unique identifier
              blockIVRFlag:
                type: boolean
                description: Flag that indicates Integrated Voice Response (IVR) or Customer
                  Touch messages
              comments:
                type: string
                description: Repair order comments
              customerHref:
                type: string
                description: The hyperlink to the Customer associated resource
              customerContactInfo:
                type: string
                description: >
                  Phone number or e-mail address given during write-up in which to
                  contact the customer. 

                  Phone numbers can include an extension.  This takes priority over contact information 

                  recorded in the Customer resource located at customerHref.
              vehicleHref:
                type: string
                description: The hyperlink to the Vehicle associated resource
              dispatchMakeCode:
                type: string
                description: Make code required for dispatching
              dropOff:
                description: Customer drop off details.  Only valid when transportType is set to
                  SHUTTLE.
                type: object
                properties:
                  dateTime:
                    type: string
                    description: The date and time for dropoff in format YYYY-MM-DDTHH:MM:SS
                  address:
                    type: string
                    description: Address at which the customer will be dropped off
                  city:
                    type: string
                    description: City in which the customer will be dropped off
                  note:
                    type: string
                    description: Additional notes regarding the customer drop off request
                  phone:
                    type: string
                    description: Phone number where the customer can be reached
                  vanNumber:
                    type: string
                    description: Van number used to drop off the customer
                example:
                  dateTime: 2018-08-12T20:19:45
                  address: 678 Montgomery St
                  city: Jersey City
                  phone: "8302852330"
                  vanNumber: 830-285-2330
              pickUp:
                description: Customer pick up details.  Only valid when transportType is set to
                  SHUTTLE.
                type: object
                properties:
                  dateTime:
                    type: string
                    description: The date and time of pickup in format YYYY-MM-DDTHH:MM:SS
                  address:
                    type: string
                    description: Address of pickup
                  city:
                    type: string
                    description: City of pickup
                  note:
                    type: string
                    description: Note
                  phone:
                    type: string
                    description: Phone number for pickup
                  vanNumber:
                    type: string
                    description: Van number
                example:
                  dateTime: 2018-08-12T20:17:45
                  address: 678 Montgomery St
                  city: Jersey City
                  note: Call before pickup
                  phone: 830-285-2330
