    post:
      summary: Update a repair order
      description: >
        Update a repair order's header information. ServiceLines can be
        added, updated, or deleted 

        using the ServiceLine endpoints
      operationId: updateRepairOrder
      tags:
        - repair order
      parameters:
        - name: Request-Id
          in: header
          required: true
          type: string
          format: guid
          description: >
            A correlation ID that should be returned back to the caller to
            indicate the return of the 

            given request
        - name: If-Match
          in: header
          required: true
          type: string
          description: >
            Makes the resource update request conditional.  The checksum value
            specified with If-Match 

            must match the current ETag value of the resource.
        - name: repairOrderId
          in: path
          description: The repair order identifier
          required: true
          type: string
        - name: UpdateRepairOrderRequest
          in: body
          description: The repair order information
          required: true
          schema:
            description: Update Repair Order request
            type: object
            properties:
              blockIVRFlag:
                type: boolean
                description: Flag that indicates integrated voice response (IVR) or Customer
                  Touch messages
              comments:
                type: string
                description: Comments
              customerHref:
                type: string
                description: The hyperlink to the associated Customer resource
              customerContactInfo:
                type: string
                description: >
                  Phone number or e-mail address given during write-up in which to
                  contact the customer. 

                  Phone numbers can include an extension.  This takes priority over contact information 

                  recorded in the Customer resource located at customerHref.
              vehicleHref:
                type: string
                description: The hyperlink to the associated Vehicle resource
              dropOff:
                description: Customer drop off details.  Only valid when transportType is set to
                  SHUTTLE.
                type: object
                properties:
                  dateTime:
                    type: string
                    description: The date and time for dropoff in format YYYY-MM-DDTHH:MM:SS
                  address:
                    type: string
                    description: Address at which the customer will be dropped off
                  city:
                    type: string
                    description: City in which the customer will be dropped off
                  note:
                    type: string
                    description: Additional notes regarding the customer drop off request
                  phone:
                    type: string
                    description: Phone number where the customer can be reached
                  vanNumber:
                    type: string
                    description: Van number used to drop off the customer
                example:
                  dateTime: 2018-08-12T20:19:45
                  address: 678 Montgomery St
                  city: Jersey City
                  phone: "8302852330"
                  vanNumber: 830-285-2330
              pickUp:
                description: Customer pick up details.  Only valid when transportType is set to
                  SHUTTLE.
                type: object
                properties:
                  dateTime:
                    type: string
                    description: The date and time of pickup in format YYYY-MM-DDTHH:MM:SS
                  address:
                    type: string
                    description: Address of pickup
                  city:
                    type: string
                    description: City of pickup
                  note:
                    type: string
                    description: Note
                  phone:
                    type: string
                    description: Phone number for pickup
                  vanNumber:
                    type: string
                    description: Van number
                example:
                  dateTime: 2018-08-12T20:17:45
                  address: 678 Montgomery St
                  city: Jersey City
                  note: Call before pickup
                  phone: 830-285-2330
                  vanNumber: 830-285-2330
              estimate:
                description: The authorized service estimate for the repair order.
                type: object
                properties:
                  authorized:
                    type: number
                    description: The authorized service estimate for the repair order
                  labor:
                    type: number
                    description: Total labor estimate for the repair order
                  parts:
                    type: number
                    description: Total parts estimate for the repair order
                  misc:
                    type: number
                    description: Total miscellaneous estimate for the repair order
                  lube:
                    type: number
                    description: Total lube estimate for the repair order
                  sublet:
                    type: number
                    description: Total sublet estimate for the repair order
                  tax:
                    type: number
                    description: Total tax estimate for the repairs
                example:
                  authorized: 200
                  labor: 80
                  parts: 40
                  misc: 30
                  lube: 30
                  sublet: 10
                  tax: 10
              mileageIn:
                description: Vehicle mileage measurement on arrival
                properties:
                  value:
                    type: number
                    description: The measurement value
                  units:
                    type: string
                    enum:
                      - MI
                      - KM
                      - HR
                    description: The units of measurement
                required:
                  - value
                  - units
                example:
                  value: 1000
                  units: MI
              poNumber:
                type: string
                description: Purchase order number
              promiseDateTime:
                type: string
                description: >
                  Promised date and time (in format YYYY-MM-DDTHH:MM:SS) for
                  returning the vehicle back to 

                  the customer
              remarks:
                type: string
                description: Remarks
              serviceAdvisorId:
                type: string
                description: Service advisor identifier
              tagNum:
                type: string
                description: Tag number assigned to the vehicle while it is being repaired
              transportType:
                type: string
                enum:
                  - CAB
                  - LOANER
                  - RENTAL
                  - SHUTTLE
                  - DROPOFF
                  - WAITER
                description: Transportation type
              workorder:
                description: Work Order object
                properties:
                  workorderPrinter:
                    type: string
                    description: Printer number to use for printing the work order
                  workorderCopies:
                    type: string
                    description: Number of copies of the workorder to print
                  partsPrinter:
                    type: string
                    description: Name of the printer to use for printing the pre-assigned parts
                      report. Only to be used if Preassigned parts are added to
                      Repair Order.
                example:
                  workorderPrinter: "1"
                  workorderCopies: "1"
                  partsPrinter: L99999
