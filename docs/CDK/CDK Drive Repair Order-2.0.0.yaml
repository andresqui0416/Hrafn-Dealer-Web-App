        type: string
        description: Labor type code
      includedParts:
        type: array
        items:
          description: Part refs response object
          properties:
            partRefId:
              type: string
              description: Part reference unique identifier
            partNumber:
              type: string
              description: Preassigned part number
            partNumberDescription:
              type: string
              description: Part number description
            mfrCode:
              type: string
              description: Manufacturer code
            partQty:
              type: number
              description: Part quantity
            saleAmount:
              type: number
              description: Sale amount
            fixedSaleFlag:
              type: boolean
              description: >
                Flag that indicates if the unit sale amount is a fixed price. If
                so, the Parts 

                application will not re-price the part.
            includesCoreFlag:
              type: boolean
              description: >
                Flag that indicates if the core amount is included in the unit sale
                amount
          required:
            - partNumber
            - partNumberDescription
            - mfrCode
            - partQty
            - saleAmount
            - fixedSaleFlag
            - includesCoreFlag
          example:
            partRefId: "1"
            fixedSaleFlag: false
            includesCoreFlag: false
            mfrCode: FR
            partNumber: P9488
            partNumberDescription: CLUTCH PLATE
            partQty: 1
            saleAmount: 30
        description: |
          The included parts specified to be used or consumed as part of the 
          specification
      saleAmount:
        type: number
        description: |
          Sale amount. Required if SaleOverride is true. Ignored if false.
      saleOverrideFlag:
        type: boolean
        description: |
          Flag that indicates if the sale amount overrides any calculated 
          amount
      shopCharge:
        type: number
        description: >
          Shop charge amount that overrides a calculated shop
          charge.  Required if ForceShopCharge 

          is true. Ignored if false.
      forceShopChargeFlag:
        type: boolean
        description: |
          Flag that indicates if the shop charge overrides any calculated amount
      soldHours:
        type: number
        description: Sold hours. Required.
    required:
      - forceShopChargeFlag
      - opCode
      - opCodeDesc
      - saleOverrideFlag
      - soldHours
      - saleAmount
    example:
      laborOperationId: "11"
      forceShopChargeFlag: false
      laborType: CEC
      opCode: SSTR
      opCodeDesc: CLUTCH REPAIR
      soldHours: 0.2
      saleAmount: 7
      saleOverrideFlag: false
      includedParts:
        - partRefId: "1"
          fixedSaleFlag: false
          includesCoreFlag: false
          mfrCode: FR
          partNumber: P9488
          partNumberDescription: CLUTCH PLATE
          partQty: 4
          saleAmount: 30
        - partRefId: "2"
          fixedSaleFlag: false
          includesCoreFlag: false
          mfrCode: FR
          partNumber: "7488"
          partNumberDescription: RETAINER CIRCLIP
          partQty: 1
          saleAmount: 5
