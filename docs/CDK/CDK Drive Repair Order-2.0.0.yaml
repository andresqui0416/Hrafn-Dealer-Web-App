      partNumberDescription:
        type: string
        description: Part number description
      mfrCode:
        type: string
        description: Manufacturer code
      partQty:
        type: number
        description: Part quantity
      saleAmount:
        type: number
        description: Sale amount
      fixedSaleFlag:
        type: boolean
        description: >
          Flag that indicates if the unit sale amount is a fixed price. If
          so, the Parts 

          application will not re-price the part.
      includesCoreFlag:
        type: boolean
        description: >
          Flag that indicates if the core amount is included in the unit sale
          amount
    required:
      - partNumber
      - partNumberDescription
      - mfrCode
      - partQty
      - saleAmount
      - fixedSaleFlag
      - includesCoreFlag
    example:
      fixedSaleFlag: false
      includesCoreFlag: false
      mfrCode: FR
      partNumber: P9488
      partNumberDescription: CLUTCH PLATE
      partQty: 1
      saleAmount: 30
  Measurement:
    description: Measurement object
    properties:
      value:
        type: number
        description: The measurement value
      units:
        type: string
        enum:
          - MI
          - KM
          - HR
        description: The units of measurement
    required:
      - value
      - units
    example:
      value: 1000
      units: MI
  LinkDescriptionObject:
    description: Link description object
    type: object
    properties:
      href:
        type: string
        description: The target URI
      rel:
        type: string
        description: The link relation type
      method:
        type: string
        description: The HTTP verb that MUST be used to make a request to the target of
          the link
      title:
        type: string
        description: A human readable title for the link that conveys the purpose of the
          link
    required:
      - href
    example:
      href: https://api.fortellis.io/cdkdrive/service/v1/repair-orders/123
      method: GET
