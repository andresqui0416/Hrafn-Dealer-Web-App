            forceShopChargeFlag: false
            laborType: CEC
            opCode: SSTR
            opCodeDesc: CLUTCH REPAIR
            soldHours: 0.2
            saleAmount: 7
            saleOverrideFlag: false
            includedParts:
              - partRefId: "1"
