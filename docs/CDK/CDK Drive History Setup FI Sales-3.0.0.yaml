swagger: "2.0"
info:
  title: CDK Drive History Setup FI Sales
  description: >
    # CDK Drive History Setup FI Sales

    The CDK Drive History Setup FI Sales API retrieves historical Vehicle Sales data older than 31 days from the CDK Drive data source.


    # What does this API do?

    The CDK Drive History Setup FI Sales API allows you to retrieve all vehicle sale records older than 31 days with a status equal to 'F' finalized and has a deal status date within a specified date range , 6 months at a time (limited to records with a deal status date in the last 5 years and 31 days) Vehicle Sales data is refreshed on an hourly basis from the CDK Drive DMS.  
  version: 3.0.0
host: api.fortellis.io
basePath: /drive/fisalessetup/v3
schemes:
  - https
tags:
  - name: CDK
  - name: CDK Drive
  - name: CDK Drive History Setup
paths:
  /history:
    get:
      summary: Retrieves Historical Vehicle Sale records with status equal to 'F'
        (finalized) older than 31 days
      description: Retrieves Historical Vehicle Sale records with status equal to 'F'
        (finalized) from the CDK Drive data source and returns the operationId
        to be used in conjunction with the status and result endpoints.
        Considering T as today's date, history requirement is to allow the start
        and end date range to be between T- 5 years and 31 days and an end date
        is less than T-31. This will allow to get 5 years worth of data. Also,
        ensure that the call can only be made for 6 months at a time.
      operationId: getHistoricalVehicleSale
      tags:
        - Get Historical Vehicle Sale
      consumes:
        - text/plain
      produces:
        - application/json
      responses:
        "202":
          description: Long Operations Received Status Response
          headers:
            Fort-Long-Request-Received-Id:
              type: string
              format: uuid
              description: Represents long running request has been received by the API
                Publisher.
          schema:
            type: object
            properties:
              operationId:
                description: The identifier from the get response, used to retrieve the status.
                type: string
                format: uuid
              status:
                description: Status of the long operation id.
                type: string
                enum:
                  - received
              receivedDateTime:
                description: Date initial received request.
                type: string
                format: date-time
              updatedDateTime:
                description: Date received response.
                type: string
                format: date-time
              checkStatusAfterSeconds:
                description: Time after which status needs to be checked.
                type: integer
                format: int32
              _links:
                description: Resource locations to get the operation status.
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      href:
                        type: string
            example:
              operationId: bdd87e16-6683-4340-8f1e-3703fb99c4b0
              status: received
              receivedDateTime: 2023-06-01T00:00:00.000Z
              updatedDateTime: 2023-06-01T00:00:03.000Z
              checkStatusAfterSeconds: 30
              _links:
                status:
                  href: https://api.fortellis.io/cdk/drive/fisalessetup/v3/long-operations/bdd87e16-6683-4340-8f1e-3703fb99c4b0/status
        "400":
          description: 400 - Bad Request
          headers:
            Request-Id:
              type: string
            status:
              type: number
          schema:
            type: object
            description: bad request response
            properties:
              code:
                type: integer
                format: int32
              message:
                type: string
            required:
              - code
              - message
            example:
              code: 400
              message: Bad Request
        "401":
          description: 401 - Unauthorized
          headers:
            Request-Id:
              type: string
            status:
              type: number
          schema:
            type: object
            description: un-authorized response
            properties:
              code:
                type: integer
                format: int32
              message:
                type: string
            required:
              - code
              - message
            example:
              code: 401
              message: Un-Authorised
        "403":
          description: 403 - Forbidden
          headers:
            Request-Id:
              type: string
            status:
              type: number
          schema:
            type: object
            description: forbidden response
            properties:
              code:
                type: integer
                format: int32
              message:
                type: string
            required:
              - code
              - message
            example:
              code: 403
              message: Forbidden
        "404":
          description: 404 - Not Found
          headers:
            Request-Id:
              type: string
            status:
              type: number
          schema:
            type: object
            description: resource not found response
            properties:
              code:
                type: integer
                format: int32
              message:
