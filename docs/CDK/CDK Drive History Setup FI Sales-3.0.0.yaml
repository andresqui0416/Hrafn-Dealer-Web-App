                type: integer
                format: int32
              message:
                type: string
            required:
              - code
              - message
            example:
              code: 429
              message: Too Many Requests
        "500":
          description: 500 - ServerError
          headers:
            Request-Id:
              type: string
            status:
              type: number
          schema:
            type: object
            description: Internal Server Error response
            properties:
              code:
                type: integer
                format: int32
              message:
                type: string
            required:
              - code
              - message
            example:
              code: 500
              message: Internal Server Error
        "502":
          description: 502 - Bad Gateway
          headers:
            Request-Id:
              type: string
            status:
              type: number
          schema:
            type: object
            description: BadGateway response
            properties:
              code:
                type: integer
                format: int32
              message:
                type: string
            required:
              - code
              - message
            example:
              code: 502
              message: Bad Gateway
        "503":
          description: 503 - Service Unavailable
