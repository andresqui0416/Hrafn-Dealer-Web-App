securityDefinitions:
  Oauth2:
    type: oauth2
    authorizationUrl: https://identity.fortellis.io/oauth2/
    flow: implicit
    scopes:
      read:deal: read vehicle sale data
parameters:
  header.Subscription-Id:
    name: Subscription-Id
    in: header
    required: true
    type: string
    description: The Fortellis Marketplace unique identifier for an organization's
      subscription to an App.
  header.Authorization:
    name: Authorization
    in: header
    required: true
    type: string
    description: Provides authorization to access Fortellis APIs. This must be an
      OAuth 2.0 token issued by the Fortellis authorization server
  header.Request-Id:
    name: Request-Id
    in: header
    required: true
    type: string
    format: guid
    description: A correlation ID (GUID) that must be sent by the caller to indicate
      the return of the given request and is unique per request.
  header.Department-Id:
    name: Department-Id
    in: header
    required: true
    type: string
    format: guid
    description: This unique ID should be added by the ISV in an API call to
      indicate a specific department within a dealer. This is essential as some
      dealers have multiple departments.
  header.Accept:
    name: Accept
    in: header
    required: true
    type: string
    description: Place holder for client to indicate which content types are
      supported, expressed as MIME types
  path.operationId:
    name: operationId
    in: path
    description: Long Operations request-response identifier.
    required: true
    type: string
    format: guid
  query.startDate:
    name: startDate
    in: query
    required: true
    type: string
    format: date-time
    description: Start date for the retrieval. Assuming T is today, retrieval will
      be from the T-5 years - 31 days until T- 31 days. The accepted date format
      is yyyy-mm-ddThh:mm:ss (e.g. 2023-01-01T10:15:30).
  query.endDate:
    name: endDate
    in: query
    required: false
    type: string
    format: date-time
    description: End date for the retrieval (must be greater than or equal to the
      start date and can not be a future date). Assuming T is today, retrieval
      will be up to T- 31 days. The accepted date format is yyyy-mm-ddThh:mm:ss
      (e.g. 2023-01-01T10:15:30). The difference between startDate and endDate
      should be less than or equal to 6 months
    default: current date - 31 days
responses:
  LongOperationReceivedResponse:
    description: Long Operations Received Status Response
    headers:
      Fort-Long-Request-Received-Id:
        type: string
        format: uuid
        description: Represents long running request has been received by the API Publisher.
    schema:
      type: object
      properties:
        operationId:
          description: The identifier from the get response, used to retrieve the status.
          type: string
          format: uuid
        status:
          description: Status of the long operation id.
          type: string
          enum:
            - received
        receivedDateTime:
          description: Date initial received request.
          type: string
          format: date-time
        updatedDateTime:
          description: Date received response.
          type: string
          format: date-time
        checkStatusAfterSeconds:
          description: Time after which status needs to be checked.
          type: integer
          format: int32
        _links:
          description: Resource locations to get the operation status.
          type: object
          properties:
            status:
              type: object
              properties:
                href:
                  type: string
      example:
        operationId: bdd87e16-6683-4340-8f1e-3703fb99c4b0
        status: received
        receivedDateTime: 2023-06-01T00:00:00.000Z
        updatedDateTime: 2023-06-01T00:00:03.000Z
        checkStatusAfterSeconds: 30
        _links:
          status:
            href: https://api.fortellis.io/cdk/drive/fisalessetup/v3/long-operations/bdd87e16-6683-4340-8f1e-3703fb99c4b0/status
  LongOperationCompletedResponse:
    description: Long Operations Complete Status Response
    headers:
      Fort-Long-Request-Status-Id:
        type: string
        format: uuid
        description: Represents long running request status has been requested by API client
    schema:
      type: object
      properties:
        operationId:
          description: The identifier from the get response, used to retrieve the status.
          type: string
          format: uuid
        status:
          description: Status of the long operation id.
          type: string
          enum:
            - received
            - complete
        receivedDateTime:
          description: Date initial received request.
          type: string
          format: date-time
        updatedDateTime:
          description: Date received response.
          type: string
          format: date-time
        checkStatusAfterSeconds:
          description: Time after which status needs to be checked.
          type: integer
          format: int32
        _links:
          description: Resource locations to get the operation status.
          type: object
          properties:
            status:
              type: object
              properties:
                href:
                  type: string
            result:
              type: object
              properties:
                href:
                  type: string
      example:
        operationId: bdd87e16-6683-4340-8f1e-3703fb99c4b0
        status: received || complete
        receivedDateTime: 2023-06-01T00:00:00.000Z
        updatedDateTime: 2023-06-01T00:00:03.000Z
        checkStatusAfterSeconds: 30 || null
        _links:
          status || result:
            href: https://api.fortellis.io/cdk/drive/fisalessetup/v3/long-operations/bdd87e16-6683-4340-8f1e-3703fb99c4b0/status
              ||
              https://api.fortellis.io/cdk/drive/fisalessetup/v3/long-operations/bdd87e16-6683-4340-8f1e-3703fb99c4b0/result
