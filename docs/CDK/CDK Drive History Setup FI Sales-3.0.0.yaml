            example:
              code: 503
              message: Service Unavailable
        "504":
          description: 504 - Gateway Timeout
          headers:
            Request-Id:
              type: string
            status:
              type: number
          schema:
            type: object
            description: Gateway Timeout Response
            properties:
              code:
                type: integer
                format: int32
              message:
                type: string
            required:
              - code
              - message
            example:
              code: 504
              message: Gateway Timeout
      parameters:
        - name: Request-Id
          in: header
          required: true
          type: string
          format: guid
          description: A correlation ID (GUID) that must be sent by the caller to indicate
            the return of the given request and is unique per request.
        - name: Department-Id
          in: header
          required: true
          type: string
          format: guid
          description: This unique ID should be added by the ISV in an API call to
            indicate a specific department within a dealer. This is essential as
            some dealers have multiple departments.
        - name: Accept
          in: header
          required: true
          type: string
          description: Place holder for client to indicate which content types are
            supported, expressed as MIME types
        - name: startDate
          in: query
          required: true
          type: string
          format: date-time
          description: Start date for the retrieval. Assuming T is today, retrieval will
            be from the T-5 years - 31 days until T- 31 days. The accepted date
            format is yyyy-mm-ddThh:mm:ss (e.g. 2023-01-01T10:15:30).
        - name: endDate
          in: query
          required: false
          type: string
          format: date-time
          description: End date for the retrieval (must be greater than or equal to the
            start date and can not be a future date). Assuming T is today,
            retrieval will be up to T- 31 days. The accepted date format is
            yyyy-mm-ddThh:mm:ss (e.g. 2023-01-01T10:15:30). The difference
            between startDate and endDate should be less than or equal to 6
            months
          default: current date - 31 days
        - &a1
          name: Subscription-Id
          in: header
          description: The Fortellis Marketplace subscription identifier between a user
            entity and the app.
          required: true
          type: string
          default: test
        - &a2
          name: Authorization
          in: header
          description: Provides authorization to access Fortellis APIs. For calling a
            Fortellis Provider, this must be an OAuth 2.0 token issued by the
            Fortellis authorization server.
          required: true
          type: string
          disabled: true
          placeholder: Automatically set
      security:
        - Oauth2: []
