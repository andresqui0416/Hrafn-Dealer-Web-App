swagger: "2.0"
info:
  version: 1.0.1
  title: CDK Drive Get Make Model Lite
  description: >+
    # CDK Drive Get Make Model Lite

    The CDK Drive Make Model API retrieves Make Model data from the CDK data source.


    # What does this API do?

    The CDK Drive Get Make Model Lite API allows you to retrieve Make Model data using two different methods. Bulk method returns all Make Model records. Delta method returns all Make Model records containing a changed date and time within a specified date range (limited to the last 5 days of changes). Make Model data is refreshed on a daily basis from the CDK Drive DMS.

securityDefinitions:
