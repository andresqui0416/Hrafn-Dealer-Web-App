      summary: Get Customer by Id
      description: >+
        Retrieves a prospect/customer record by Elead customer ID. An Elead
        customer ID is currently obtained as follows:
          - Create customer via POST /sales/v1/elead/customers
          
          - Search opportunities via GET /sales/v1/elead/opportunities/search
          
