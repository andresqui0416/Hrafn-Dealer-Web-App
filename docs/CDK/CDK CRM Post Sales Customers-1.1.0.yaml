                      type: string
                    rel:
                      description: The link relation type
                      type: string
                      example: create
                    method:
                      description: The HTTP verb that MUST be used to make a request to the target of
                        the link
                      type: string
                      example: POST
                    title:
                      description: The title that describes the object
