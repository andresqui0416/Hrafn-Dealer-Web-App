  /:
    post:
      summary: Create a customer
      description: Creates a prospect/customer
      tags:
        - Customers
      operationId: Customers_CreateCustomer
      consumes: []
      produces:
        - application/json
      parameters:
        - name: Accept
          in: header
          required: false
          type: string
        - name: Accept-Charset
          in: header
          required: false
          type: string
        - name: Accept-Encoding
          in: header
          required: false
          type: string
        - name: Accept-Language
          in: header
          required: false
          type: string
        - name: If-Match
          in: header
          required: false
          type: string
        - name: If-None-Match
          in: header
          required: false
          type: string
        - name: Prefer
          in: header
          required: false
          type: string
          format: enum
          enum:
            - return=minimal
            - return=representation
        - name: Request-Id
          in: header
          required: true
          type: string
        - name: request
          in: body
          required: true
          schema:
            type: object
            properties:
              isBusiness:
                description: true/false whether this customer is a business
                type: boolean
              businessName:
                description: Business name, set when isBusiness is true
                type: string
              businessContact:
                description: Name of the business contact person, set when isBusiness is true
                type: string
              title:
                description: Customers title
                type: string
                enum:
                  - Unspecified
                  - Mr
                  - Mrs
                  - Ms
                  - Dr
                  - Sir
                  - Miss
                  - Rev
                  - MrAndMrs
                  - Admr
                  - Capt
                  - Cdr
                  - Chief
                  - Col
                  - Gen
                  - Judge
                  - Lt
                  - Sgt
              firstName:
                description: Customer first name
                type: string
              middleName:
                description: Customer middle name
                type: string
              lastName:
                description: Customer last name
                type: string
              nickname:
                description: Customer nickname
                type: string
              birthday:
                description: Customer birthday
                type: string
                format: date-time
              emails:
                description: Customer Email address(es)
                type: array
                items:
                  type: object
                  properties:
                    address:
                      description: Customer Email address
                      type: string
                    emailType:
                      enum:
                        - Unknown
                        - Personal
                        - Work
                        - Pager
                        - Alternate
                      type: string
                    doNotEmail:
                      description: true/false to flag as Do Not Email
                      type: boolean
                    isPreferred:
                      description: true/false whether this is the customers preferred email address
                      type: boolean
                  required:
                    - address
                    - emailType
                  example:
                    address: customerEmail@sample.com
                    emailType: Personal
                    doNotEmail: false
                    isPreferred: true
              phones:
                description: Customer phone number(s)
                type: array
                items:
                  type: object
                  properties:
                    number:
                      description: Phone number
                      type: string
                    phoneType:
                      enum:
                        - Unknown
                        - Home
                        - Cellular
                        - Work
                      type: string
                    preferredTimeToContact:
                      enum:
                        - Unspecified
                        - Day
                        - Evening
                      type: string
                    doNotCall:
                      description: true/false to flag as Do Not Call
                      type: boolean
                    doNotText:
                      description: true/false to flag as Do Not Text
                      type: boolean
                    preferCall:
                      description: true/false whether the customer prefers to be contacted by phone
                      type: boolean
                    preferText:
                      description: true/false whether the customer prefers to be contacted by text
                      type: boolean
                  required:
                    - number
                    - phoneType
                    - preferredTimeToContact
                  example:
                    number: (555) 555-1234
                    phoneType: Cellular
                    preferredTimeToContact: Evening
                    doNotCall: false
                    doNotText: true
                    preferCall: true
                    prefetText: false
              address:
                type: object
                properties:
                  addressLine1:
                    description: Customer address line 1
                    type: string
                  addressLine2:
                    description: Customer address line 2
                    type: string
                  city:
                    description: Customer city
                    type: string
                  state:
                    description: Customer state
                    type: string
                  zip:
                    description: Customer postal code
                    type: string
                  country:
                    description: Customer country
                    type: string
                  county:
                    description: Customer county
                    type: string
                  doNotMail:
                    description: true/false to flag as Do Not Mail
                    type: boolean
                  isPreferred:
                    description: true/false whether this is the customers preferred address
                    type: boolean
                required:
                  - zip
                example:
                  addressLine1: 799 E DRAGRAM
                  addressLine2: SUITE 5A
                  city: TUCSON
                  state: AZ
                  zip: "85705"
                  country: USA
                  county: ORANGE
                  doNotMail: false
                  isPreferred: true
