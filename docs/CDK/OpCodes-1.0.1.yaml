swagger: "2.0"
info:
  version: 1.0.1
  title: OpCodes
  description: >
    ## CDK Drive - Service - Catalog - OpCodes

    A labor operation code (opcode) is used to specify the work to be done in service requests contained in CDK Drive appointments and repair-orders.


    ## What does this API do?

    The API will allow you to query CDK Drive service opcodes to return data such as the description and hours to complete the operation. 


    ## Intended Audience

    It is expected that systems that require query access to CDK Drive opcodes will use this API. 
  contact:
    name: Fortellis Development
    email: info@fortellis.io
host: api.fortellis.io
basePath: /cdkdrive/service/catalog/v1/opcodes
