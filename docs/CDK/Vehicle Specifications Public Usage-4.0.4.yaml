          required: true
          description: The ISO 3779:2009 vehicle-identification-number (VIN)
          type: string
        - &a1
          name: Subscription-Id
          in: header
          description: The Fortellis Marketplace subscription identifier between a user
            entity and the app.
          required: true
          type: string
          default: test
        - &a2
          name: Authorization
          in: header
          description: Provides authorization to access Fortellis APIs. For calling a
            Fortellis Provider, this must be an OAuth 2.0 token issued by the
            Fortellis authorization server.
          required: true
          type: string
          disabled: true
          placeholder: Automatically set
      consumes:
        - application/json
      produces:
        - application/json
      responses:
        "200":
          description: OK
          headers:
            Content-Language:
              type: string
            Content-Type:
              type: string
            Request-Id:
              type: string
          schema:
            description: A response containing a complete vehicle specification
            properties:
