swagger: "2.0"
info:
  version: 4.0.4
  title: Vehicle Specifications
  description: >
    # Vehicle Specifications

    Vehicle Specifications is the association of vehicle make, model and variant. This information is stored by data provider so that vehicles can be consistently identified.


    # What does this API do?

    The API will allow you to retrieve vehicle specifications by vin, vehicleSpecId, make, model or variant.


    # Intended Audience

    The Vehicle Specifications API is required for any API that uses vehicles as part of their query or results.
  contact:
    name: CDK Global
    url: https://cdkglobal.com
    email: info@cdk.com
host: api.fortellis.io
basePath: /vehicles/reference/v4/vehicle-specifications
securityDefinitions:
  permission-model:
    type: oauth2
    flow: implicit
    authorizationUrl: https://identity.fortellis.io/oauth2/
schemes:
