                        description: Array of abbreviations
                        type: object
                        properties:
                          index:
                            type: integer
                            description: Index number
                          abbreviation:
                            type: string
                            description: Make abbreviation associated with a dispatch make code
                        example:
                          index: 1
                          abbreviation: AB
                  required:
                    - dispatchMakeCodeId
                  example:
                    dispatchMakeCodeId: C
                    makeAbbreviations:
                      - index: 1
                        abbreviation: CHRY
                      - index: 2
                        abbreviation: DODG
            required:
              - items
            example:
              items:
                - dispatchMakeCodeId: C
                  makeAbbreviations:
                    - index: 1
                      abbreviation: CHRY
