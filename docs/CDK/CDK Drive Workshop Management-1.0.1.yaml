swagger: "2.0"
info:
  version: 1.0.1
  title: Workshop Management
  description: >
    ## CDK Drive - Workshop - Management

    The Workshop Management API is a collection of lookup functions to be used in the CDKDrive Service Workflows such as Repair Order and Service Appointment.


    ## What does this API do?

    The API will allow you to query and retrieve dispatch code, dispatch make code, labor type, service advisor, and technician information in CDK Drive.


    ## Intended Audience

    It is expected that systems which require query access to dispatch codes, labor types, service advisors, or technicians will use this API. 
basePath: /service/cdk-drive/v1/workshop-management
schemes:
  - https
paths:
  /dispatch-codes:
    get:
      summary: Query dispatch codes
      description: Query dispatch codes
      operationId: queryDispatchCodes
      tags:
        - lookups
      parameters:
        - name: Request-Id
          in: header
          required: true
          type: string
          format: guid
          description: >
            A correlation ID that should be returned back to the caller to
            indicate the return of the 

            given request
        - &a1
          name: Subscription-Id
          in: header
          description: The Fortellis Marketplace subscription identifier between a user
            entity and the app.
          required: true
          type: string
          default: test
        - &a2
          name: Authorization
          in: header
          description: Provides authorization to access Fortellis APIs. For calling a
            Fortellis Provider, this must be an OAuth 2.0 token issued by the
            Fortellis authorization server.
          required: true
          type: string
          disabled: true
          placeholder: Automatically set
      produces:
        - application/json
      responses:
        "200":
          description: OK
          headers:
            Request-Id:
              type: string
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  type: object
                  required:
                    - dispatchCodeId
                  example:
                    dispatchCodeId: S102
                    estimatedDuration: 2.5
                    description: General Diagnostics
                  properties:
                    dispatchCodeId:
                      type: string
                      description: Dispatch code
                    estimatedDuration:
                      type: number
                      description: Estimated duration of a job in tenths of an hour
                    description:
                      type: string
                      description: Dispatch code description
            required:
              - items
            example:
              items:
                - dispatchCodeId: S102
                  estimatedDuration: 2.5
                  description: General diagnostics
                - dispatchCodeId: S104
                  estimatedDuration: 1.5
                  description: Computer diagnostics
        "400":
          description: 400 - Bad Request
          headers:
            Request-Id:
              type: string
          schema:
            type: array
            items:
              minItems: 1
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                message:
                  type: string
              required:
                - code
                - message
              example:
                code: 500
                message: Internal error
        "401":
          description: 401 - Unauthorized
          headers:
            Request-Id:
              type: string
          schema:
            type: array
            items:
              minItems: 1
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                message:
                  type: string
              required:
                - code
                - message
              example:
                code: 500
                message: Internal error
        "403":
          description: 403 - Forbidden
          headers:
            Request-Id:
              type: string
          schema:
            type: array
            items:
              minItems: 1
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                message:
                  type: string
              required:
                - code
                - message
              example:
                code: 500
                message: Internal error
        "404":
          description: 404 - Not Found
          headers:
            Request-Id:
              type: string
          schema:
            type: array
            items:
              minItems: 1
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                message:
                  type: string
              required:
                - code
                - message
              example:
                code: 500
                message: Internal error
